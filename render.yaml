# Together API + PostgreSQL на Render (free).
# Dashboard → New → Blueprint → репозиторий Tim124v/Together.
# Фронтенд остаётся на Vercel.

services:
  - type: web
    name: together-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: together-backend
    buildCommand: npm ci --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_SYNC
        value: sync
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: together-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false

databases:
  - name: together-db
    plan: free
    region: frankfurt
    databaseName: together
    user: together_user
    postgresMajorVersion: "16"
    ipAllowList: []
